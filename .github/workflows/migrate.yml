name: Migrate

# Applies a PR's supabase/migrations to staging when the PR is ready for review
# (ADR 0030). Production is migrated by release-please.yml on a release. Agents
# have no key that can change a production schema.
#
# Other PRs' migrations may already be on staging. The script writes an empty
# placeholder file for each version staging holds that the checkout lacks and
# pushes with --include-all, so each PR applies only its own migrations. The
# placeholders exist only in the job's checkout.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - supabase/migrations/**
      - .github/workflows/migrate.yml
      - .github/workflows/migrate-staging.sh

permissions:
  contents: read

jobs:
  staging:
    name: Migrate staging
    if: >-
      github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    concurrency:
      group: migrate-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Read the Supabase CLI version from the lockfile
        id: cli
        run: echo "version=$(grep -m1 -oP '^  supabase@\K[0-9][^:]*(?=:)' pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ steps.cli.outputs.version }}
      - name: Apply migrations to staging
        env:
          SUPABASE_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: bash .github/workflows/migrate-staging.sh "$SUPABASE_DB_URL"
