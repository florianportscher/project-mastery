name: Migrate

# Applies supabase/migrations to the hosted databases (ADR 0030). Staging gets a
# PR's migrations when the PR is ready for review; production gets them after
# the merge, once the maintainer approves the run. Agents have no key that can
# change a schema.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - supabase/migrations/**
      - .github/workflows/migrate.yml
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - .github/workflows/migrate.yml

permissions:
  contents: read

jobs:
  staging:
    name: Migrate staging
    if: >-
      github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    environment: database-staging
    concurrency:
      group: migrate-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - name: Apply migrations to staging
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          case "$SUPABASE_DB_URL" in
            *@db.*.supabase.co*)
              echo "::error::SUPABASE_DB_URL is the direct connection, which is IPv6-only and unreachable from GitHub runners. Use the session pooler URI (host aws-0-<region>.pooler.supabase.com, port 5432, user postgres.<project-ref>)."
              exit 1 ;;
          esac
          status=0
          supabase db push --remote="$SUPABASE_DB_URL" --yes > push.log 2>&1 || status=$?
          cat push.log
          if [ "$status" -ne 0 ]; then
            if grep -q DbPushMissingLocalError push.log; then
              version=$(grep -oE 'reverted [0-9]{14}' push.log | head -1 | cut -d' ' -f2)
              echo "::error::Staging holds migration ${version:-<see log>} that this branch lacks. It belongs to another PR that was tried on staging. Merge main into the branch once that PR is merged."
            else
              echo "::error::supabase db push failed (exit $status), see the log above."
            fi
            exit "$status"
          fi

  production:
    name: Migrate production
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: database-production
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - name: Apply migrations to production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          case "$SUPABASE_DB_URL" in
            *@db.*.supabase.co*)
              echo "::error::SUPABASE_DB_URL is the direct connection, which is IPv6-only and unreachable from GitHub runners. Use the session pooler URI (host aws-0-<region>.pooler.supabase.com, port 5432, user postgres.<project-ref>)."
              exit 1 ;;
          esac
          supabase db push --remote="$SUPABASE_DB_URL" --yes
